<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>GMinsta</title>
  <link rel="stylesheet" href="/public/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="home-page">
  <div class="insta-shell">
    <header class="insta-top">
      <span class="insta-logo">GMinsta</span>
      <div class="insta-top-actions">
        <a href="#" class="insta-icon-btn" id="notifBtn" title="Notifications" aria-label="Notifications">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </a>

        <a href="/chat" class="insta-icon-btn" title="Messages" aria-label="Messages">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </a>

        <button type="button" class="insta-icon-btn" onclick="logout()" title="Log out" aria-label="Log out">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <section class="insta-stories" aria-label="Stories">
      <div class="insta-stories-track" id="storiesTrack">
        <!-- Filled by home.js -->
      </div>
    </section>

    <main class="insta-feed" id="posts">
      <!-- Filled by home.js -->
    </main>

    <div class="insta-create" id="createPanel" hidden>
      <div class="insta-create__inner">
        <h2 class="insta-create__title">New post</h2>
        <form id="postForm">
          <textarea id="content" rows="3" placeholder="Write a caption..."></textarea>
          <input id="imageUrl" type="url" placeholder="Image URL (optional)" />
          <button type="submit" class="insta-btn-primary">Share</button>
        </form>
      </div>
    </div>

    <nav class="insta-bottom" aria-label="Main">
      <a href="/home" class="insta-nav-item insta-nav-item--active" aria-current="page" id="homeNav">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
        </svg>
        <span class="insta-nav-label">Home</span>
      </a>

      <a href="/chat" class="insta-nav-item" id="chatNav">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="insta-nav-label">Chat</span>
      </a>

      <button type="button" class="insta-nav-item" id="toggleCreate" title="Create">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="4"></rect>
          <path d="M12 8v8M8 12h8"></path>
        </svg>
        <span class="insta-nav-label">Create</span>
      </button>

      <a href="/profile" class="insta-nav-item" id="profileNav">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="5"></rect>
          <circle cx="12" cy="10" r="3"></circle>
          <path d="M7 18c1.5-2 3.3-3 5-3s3.5 1 5 3"></path>
        </svg>
        <span class="insta-nav-label">Profile</span>
      </a>
    </nav>
  </div>

  <script src="/public/js/shared.js"></script>
  <script src="/public/js/home.js"></script>
</body>
</html>
